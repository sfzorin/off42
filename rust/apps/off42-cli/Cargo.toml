[package]
name = "off42-cli"
version = "0.1.0"
edition = "2021"
description = "Cross-platform off42 command line over the shared document cores"

[[bin]]
name = "off42"
path = "src/main.rs"

[dependencies]
doc42-core = { path = "../../crates/doc42-core" }
xls42-core = { path = "../../crates/xls42-core" }
ppt42-core = { path = "../../crates/ppt42-core" }
pdf42-core = { path = "../../crates/pdf42-core" }
img42-core = { path = "../../crates/img42-core" }
label42 = { path = "../../crates/label42" }
marks42 = { path = "../../crates/marks42" }
suite42-pdf-text = { path = "../../crates/suite42-pdf-text" }
lopdf = "0.47"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
