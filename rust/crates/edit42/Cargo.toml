[package]
name = "edit42"
version = "0.1.0"
edition = "2021"
publish = false
description = "Serializable editing commands and edit sessions over doc42-core and xls42-core (web, assistant, other shells)"

[dependencies]
doc42-core = { path = "../doc42-core" }
xls42-core = { path = "../xls42-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
