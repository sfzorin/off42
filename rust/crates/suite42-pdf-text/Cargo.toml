[package]
name = "suite42-pdf-text"
version = "0.1.0"
edition = "2021"
[dependencies]
lopdf = "0.47"
ttf-parser = "0.21"

# Browser builds (wasm32-unknown-unknown) take randomness from Web Crypto.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
