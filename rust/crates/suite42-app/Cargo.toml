[package]
name = "suite42-app"
version = "0.1.0"
edition = "2021"
description = "Portable application services shared by the off42 Windows, Linux, command-line and web shells"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
label42 = { path = "../label42" }
marks42 = { path = "../marks42" }
pdf42-core = { path = "../pdf42-core" }
doc42-core = { path = "../doc42-core" }
xls42-core = { path = "../xls42-core" }
unicode-segmentation = "1"
lopdf = "0.47"
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
suite42-core = { path = "../suite42-core" }

[dev-dependencies]
scn42-core = { path = "../scn42-core" }
