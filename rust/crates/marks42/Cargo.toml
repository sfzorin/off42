[package]
name = "marks42"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generated handwritten signatures and stamp impressions shared by the Windows apps (port of the macOS Kit42 generators)."

[dependencies]
tiny-skia = "0.11.4"
ttf-parser = "0.25"
rustybuzz = "0.20"
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
