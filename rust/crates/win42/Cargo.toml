[package]
name = "win42"
version = "0.1.0"
edition = "2021"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Xps", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
label42 = { path = "../label42" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
suite42-core = { path = "../suite42-core" }

[dev-dependencies]
doc42-core = { path = "../doc42-core" }
tempfile = "3"
