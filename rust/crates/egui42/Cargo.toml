[package]
name = "egui42"
version = "0.1.0"
edition = "2021"
description = "Experimental egui host for the off42 apps on Linux and macOS; Windows uses the Win32 host in win42"

[features]
# Headless harness (egui_kittest) for structure tests of the host window.
kittest = ["dep:egui_kittest", "egui_kittest/eframe"]
# Also render harness states to PNG through wgpu (CI screenshots; needs a Vulkan/GL software device).
shots = ["kittest", "egui_kittest/wgpu", "dep:image"]

[dependencies]
suite42-app = { path = "../suite42-app" }
suite42-core = { path = "../suite42-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Rasterises the interface icons and concave slide shapes (already used by img42-core and label42).
resvg = "=0.45.1"
egui_kittest = { version = "0.37", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
