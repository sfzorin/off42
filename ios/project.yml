# XcodeGen spec of the iPad/iPhone app (ARCHITECTURE.md D11). The .xcodeproj is generated, not committed:
#   sh rust/scripts/build-mobile-apple.sh     # engine XCFramework + Swift bindings in rust/build/apple
#   cd ios && xcodegen generate               # OFF42.xcodeproj
# See ios/README.md.
name: OFF42
options:
  bundleIdPrefix: cc.off42
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES
targets:
  OFF42:
    type: application
    platform: iOS
    sources:
      - path: OFF42
      # UniFFI Swift bindings generated by rust/scripts/build-mobile-apple.sh.
      - path: ../rust/build/apple/swift/Off42Mobile.swift
        group: Engine
    dependencies:
      - framework: ../rust/build/apple/Off42MobileFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.off42.office
        PRODUCT_NAME: OFF42
        INFOPLIST_FILE: OFF42/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  OFF42Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OFF42Tests
      - path: ../android/app/src/androidTest/assets/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: OFF42
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.off42.office.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OFF42.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OFF42
        BUNDLE_LOADER: $(TEST_HOST)
  OFF42UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OFF42UITests
      # The UI tests check the files the app wrote with the same engine.
      - path: ../rust/build/apple/swift/Off42Mobile.swift
        group: Engine
      - path: ../android/app/src/androidTest/assets/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: OFF42
      - framework: ../rust/build/apple/Off42MobileFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.off42.office.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OFF42
schemes:
  OFF42:
    build:
      targets:
        OFF42: all
        OFF42Tests: [test]
        OFF42UITests: [test]
    test:
      config: Debug
      targets:
        - OFF42Tests
        - OFF42UITests
    archive:
      config: Release
