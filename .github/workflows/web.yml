name: Web
on:
  push:
    branches: ['main']
    paths: ['web/**', 'rust/**', 'website/**', 'assistant/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'rust/**', 'website/**', 'assistant/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # off42.cc serves a committed build of the app (website/public/app): Cloudflare's build cannot compile Rust.
  # Fails when web/ or the off42-wasm crate changed without republishing (sh web/scripts/publish-to-site.sh).
  site-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: website/public/app is up to date with web/ and off42-wasm
        run: node web/scripts/site-build.mjs check website/public/app
      - name: Exercise the published browser tools
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
          npm run test:ui -- --dir ../website/public/app --screenshots ../build/web-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: build/web-screenshots
          retention-days: 14
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build && npm run check
      - run: npm run test:assistant
  wasm:
    runs-on: ubuntu-latest
    env:
      WASM_BINDGEN_VERSION: 0.2.130
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-bindgen
            rust/target
          key: web-wasm-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: web-wasm-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Install wasm-bindgen-cli
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $WASM_BINDGEN_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - name: Which core crates compile for wasm32-unknown-unknown
        working-directory: rust
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p suite42-core -p suite42-pdf-text -p doc42-core -p xls42-core -p ppt42-core -p pdf42-core
          -p img42-core -p scn42-core -p label42 -p marks42 -p off42-wasm
      - name: Native tests of the web API
        working-directory: rust
        run: cargo test --locked -p off42-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build the wasm package
        working-directory: web
        run: npm run build:wasm
      - name: Build the web app
        working-directory: web
        run: npm run build
      - name: Smoke test (Node loads the wasm and converts fixtures; build is self-contained)
        working-directory: web
        run: |
          npm test
          node ../website/test/large-assistant.mjs
      - name: Headless browser test
        working-directory: web
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: off42-web
          path: web/dist
          retention-days: 14
